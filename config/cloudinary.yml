production:
  cloud_name: <%= ENV['CLOUDINARY_CLOUD_NAME'] %>
  api_key: <%= ENV['CLOUDINARY_API_KEY'] %>
  api_secret: <%= ENV['CLOUDINARY_API_SECRET'] %>
  secure: true

development:
  cloud_name: <%= ENV.fetch('CLOUDINARY_CLOUD_NAME', 'connectinghearts') %>
  api_key: <%= ENV.fetch('CLOUDINARY_API_KEY', '1234567890') %>
  api_secret: <%= ENV.fetch('CLOUDINARY_API_SECRET', 'secret') %>
  secure: true

test:
  cloud_name: <%= ENV.fetch('CLOUDINARY_CLOUD_NAME', 'test') %>
  api_key: <%= ENV.fetch('CLOUDINARY_API_KEY', '1234567890') %>
  api_secret: <%= ENV.fetch('CLOUDINARY_API_SECRET', 'secret') %>
  secure: true
