<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>400 - Bad Request | Connecting Hearts Foundation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-serif { font-family: 'Playfair Display', Georgia, serif; }
    .brand-gradient {
      background: linear-gradient(135deg, #1e0e1e 0%, #2e152d 50%, #43173d 100%);
    }
  </style>
</head>
<body class="brand-gradient min-h-screen text-white flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Ambient Glow Effects -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-purple-500/15 rounded-full blur-3xl pointer-events-none"></div>

  <main class="max-w-xl w-full text-center space-y-8 relative z-10 bg-slate-900/60 border border-white/15 backdrop-blur-2xl rounded-3xl p-8 sm:p-12 shadow-2xl">
    
    <!-- Header Badge -->
    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-amber-400/15 border border-amber-400/30 text-amber-300 text-xs font-bold uppercase tracking-widest">
      <span>400 • Bad Request</span>
    </div>

    <!-- Error Number & Title -->
    <div class="space-y-3">
      <h1 class="font-serif text-6xl sm:text-7xl font-extrabold text-amber-300 tracking-tight">400</h1>
      <h2 class="font-serif text-2xl sm:text-3xl font-bold text-white">Invalid Request Received.</h2>
      <p class="text-sm sm:text-base text-purple-100/80 font-light leading-relaxed max-w-md mx-auto">
        Your browser sent a request that this server could not understand or parse cleanly. Please check the URL or return home.
      </p>
    </div>

    <!-- Quick Action Links -->
    <div class="pt-4 border-t border-white/10 space-y-3">
      <p class="text-xs font-bold uppercase tracking-wider text-purple-200/60">Quick Links</p>
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
        <a href="/" class="px-5 py-3 rounded-2xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold text-xs uppercase tracking-wider shadow-lg transition-all flex items-center justify-center gap-2">
          <span>🏠 Return Home</span>
        </a>

        <a href="/contact" class="px-5 py-3 rounded-2xl bg-white/10 hover:bg-white/20 border border-white/20 text-white font-bold text-xs uppercase tracking-wider transition-all flex items-center justify-center gap-2">
          <span>📞 Contact Support</span>
        </a>
      </div>
    </div>

    <!-- Foundation Footer Tag -->
    <div class="pt-4 border-t border-white/10 text-[11px] text-purple-200/50">
      Connecting Hearts for Singles & Married Foundation • Warri, Delta State, Nigeria
    </div>

  </main>

</body>
</html>
